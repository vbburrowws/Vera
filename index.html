<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17181c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VERA">
<link rel="manifest" href="manifest.json">
<title>VERA — V's Everyday Routine Assistant</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#17181c;--muted:#747780;--line:#e5e5e9;--accent:#7c5cff;--nav:#fff;--good:#278a62}
[data-theme=dark]{--bg:#111216;--card:#1b1c21;--text:#f4f4f5;--muted:#9b9da7;--line:#2b2d34;--nav:#18191e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;padding-bottom:92px;min-width:320px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.themeBtn{width:42px;height:42px;padding:0;border-radius:14px;background:var(--card);color:var(--text);border:1px solid var(--line);font-size:20px}
header{padding:18px 16px 8px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);z-index:5}
.brand{font-weight:800;font-size:24px}.sub{color:var(--muted);font-size:12px;margin-top:3px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:12px 0 5px}.day{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 2px;min-width:0;text-align:center;font-weight:700;font-size:12px}.day small{display:block;font-size:8px;opacity:.7;margin-top:2px}.day.active{background:var(--accent);color:white;border-color:var(--accent)}
main{padding:8px 12px;max-width:720px;margin:auto}.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:8px 0 12px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.hero h2{margin:5px 0 14px;font-size:27px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--bg);border-radius:15px;padding:11px 8px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.card h3{margin:0 0 10px;font-size:16px}.meal{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}.meal input{width:20px;height:20px;accent-color:var(--accent)}.meal small{display:block;color:var(--muted);margin-top:2px}
button{font:inherit;border:0;border-radius:12px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:700}.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}.full{width:100%;margin-top:10px}
.progress{height:9px;background:var(--bg);border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:9px}
.section{display:none}.section.active{display:block}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(72px + env(safe-area-inset-bottom));padding:5px 5px calc(5px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--nav) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;z-index:10}nav button{flex:1;background:transparent;color:var(--muted);padding:6px 2px;font-size:10px}nav button.active{color:var(--accent)}nav span{display:block;font-size:21px;margin-bottom:2px}
.recipe{padding:12px 0;border-top:1px solid var(--line)}.pill{display:inline-block;background:var(--bg);padding:5px 8px;border-radius:9px;font-size:11px;margin-right:4px}.notice{padding:12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--card));font-size:13px;line-height:1.45}.greeting{font-size:14px;color:var(--muted);font-weight:600}.heroTitle{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.heroTitle h2{flex:1}.status{font-size:10px;padding:6px 8px;border-radius:999px;background:var(--bg);font-weight:800;white-space:nowrap}.nextMeal{display:flex;gap:12px;align-items:center}.mealIcon{width:46px;height:46px;border-radius:15px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}.nextMeal b{font-size:16px}.nextMeal small{display:block;color:var(--muted);margin-top:3px}.timeline{display:grid;gap:0}.timeRow{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.timeRow:first-child{border-top:0}.activity{display:flex;justify-content:space-between;gap:10px}.metric{background:var(--bg);border-radius:14px;padding:11px;flex:1}.metric b{display:block;font-size:17px}.metric span{font-size:10px;color:var(--muted)}
@media(min-width:700px){nav{position:fixed;top:0;bottom:0;right:auto;width:180px;height:100vh;flex-direction:column;padding:30px 12px}nav button{text-align:left;font-size:13px;padding:13px}nav span{display:inline;margin-right:8px}body{padding-left:180px;padding-bottom:0}header{position:relative}.days{max-width:720px;margin:auto}}
</style>
</head>
<body>
<header><div class="topbar"><div><div class="brand">VERA</div><div class="sub">V's Everyday Routine Assistant</div></div><button class="themeBtn" onclick="settings()" aria-label="Toggle dark mode">◐</button></div><div class="days" id="days"></div></header>
<main>
<section id="today" class="section active"></section>
<section id="week" class="section"></section>
<section id="meals" class="section"></section>
<section id="shop" class="section"></section>
<section id="connect" class="section"></section>
</main>
<nav id="nav"></nav>
<script>
const KEY="vera_iphone_v2";
const names=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const defaultMeals=[
{id:"breakfast",cat:"Breakfast",emoji:"🍞",name:"English muffin breakfast sandwich",kcal:378,p:28,c:31,f:16,ingredients:[["Woolies","English muffins",5],["Woolies","Eggs",10],["Woolies","Lean ham",250]]},
{id:"bigmac",cat:"Lunch",emoji:"🍔",name:"Big Mac beef bowl",kcal:510,p:42,c:50,f:15,ingredients:[["Woolies","Extra-lean beef mince",900],["Woolies","Lettuce",2],["Woolies","Cucumber",2],["Woolies","Pickles",1],["Woolies","Light mayo",1]]},
{id:"greek",cat:"Lunch",emoji:"🇬🇷",name:"Greek chicken bowl",kcal:450,p:47,c:40,f:11,ingredients:[["Woolies","Shredded chicken breast",750],["Woolies","Lettuce",2],["Woolies","Cucumber",2],["Woolies","Tomatoes",6],["Woolies","Tzatziki",1]]},
{id:"kfc",cat:"Lunch",emoji:"🥗",name:"KFC-style crunch bowl",kcal:367,p:16,c:33,f:19,ingredients:[["Woolies","Chicken breast",500],["Woolies","Lettuce",2],["Woolies","Corn",1],["Woolies","Light dressing",1]]},
{id:"beefroll",cat:"Lunch",emoji:"🌯",name:"Big Mac beef rice-paper rolls",kcal:520,p:40,c:50,f:14,ingredients:[["Woolies","Extra-lean beef mince",900],["Woolies","Rice paper",15],["Woolies","Lettuce",2],["Woolies","Cucumber",2],["Woolies","Pickles",1]]},
{id:"carrots",cat:"Snacks",emoji:"🥕",name:"Carrots + tzatziki",kcal:76,p:3,c:5,f:3,ingredients:[["Woolies","Carrots",1],["Woolies","Tzatziki",1]]},
{id:"yopro",cat:"Snacks",emoji:"🥛",name:"YoPRO strawberry",kcal:119,p:20,c:7,f:1,ingredients:[["Woolies","YoPRO yoghurt",5]]},
{id:"banana",cat:"Snacks",emoji:"🍌",name:"Banana",kcal:100,p:1,c:23,f:0,ingredients:[["Woolies","Bananas",10]]},
{id:"lasagne",cat:"Dinner",emoji:"🍝",name:"High-protein beef lasagne",kcal:627,p:51,c:50,f:24,ingredients:[["Woolies","Extra-lean beef mince",1000],["Woolies","Lasagne sheets",1],["Woolies","Passata",2],["Woolies","Light cheese",1]]},
{id:"stirfry",cat:"Dinner",emoji:"🍜",name:"Beef stir-fry noodles",kcal:485,p:55,c:33,f:15,ingredients:[["Woolies","Lean beef",750],["Woolies","Noodles",5],["Woolies","Stir-fry vegetables",3],["Woolies","Stir-fry sauce",1]]},
{id:"friedrice",cat:"Dinner",emoji:"🍚",name:"Chicken fried rice",kcal:520,p:45,c:58,f:12,ingredients:[["Woolies","Shredded chicken breast",750],["Woolies","Microwave rice",5],["Woolies","Frozen vegetables",2],["Woolies","Eggs",5]]},
{id:"berry",cat:"Dessert",emoji:"🍓",name:"Berry yoghurt bowl",kcal:251,p:31,c:24,f:3,ingredients:[["Woolies","Greek yoghurt",1],["Woolies","Frozen berries",1]]},
{id:"creami",cat:"Dessert",emoji:"🍦",name:"Strawberry cheesecake CREAMi",kcal:235,p:22,c:25,f:3,ingredients:[["Woolies","High-protein yoghurt",5],["Woolies","Skim milk",1],["Woolies","Frozen strawberries",1]]}];
const old=JSON.parse(localStorage.getItem("vera_iphone_v1")||"null");
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{day:old?.day||new Date().getDay()||7,theme:old?.theme||"light",customMeals:[],planned:{},eaten:{},events:[]};
S.customMeals=S.customMeals||[];S.planned=S.planned||{};S.eaten=S.eaten||{};S.events=S.events||[];
const meals=()=>[...defaultMeals,...S.customMeals];
const fallback=i=>i===6?["banana","breakfast","greek","carrots","stirfry","berry"]:["banana","breakfast","bigmac","carrots","lasagne","berry"];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function get(id){return meals().find(m=>m.id===id)}
function type(i){const es=S.events.filter(e=>e.date&&new Date(e.date+"T12:00").getDay()===(i%7));const t=es.map(e=>e.title).join(" ").toLowerCase();if(/fitstop|hyrox|turf|training|gym|coaching/.test(t))return"HARD";if(/leave|holiday|rest|recovery/.test(t))return"EASY";return i===6?"EASY":i===5?"HARD":"NORMAL"}
function target(i){return type(i)==="HARD"?{k:1950,p:160,c:200,f:55}:type(i)==="EASY"?{k:1800,p:160,c:160,f:55}:{k:1850,p:160,c:175,f:55}}
function nav(){document.getElementById("nav").innerHTML=[["today","⌂","Today"],["week","▦","Week"],["meals","◉","Meals"],["shop","🛒","Shop"],["connect","⚙","Connect"]].map(x=>'<button onclick="show(\''+x[0]+'\')" id="n-'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join("")}
function days(){document.getElementById("days").innerHTML=names.map((n,i)=>'<button class="day '+(S.day===i+1?"active":"")+'" onclick="S.day='+(i+1)+';save();render()"><b>'+n+'</b><small>'+type(i+1)+'</small></button>').join("")}
function show(id){document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById("n-"+id).classList.add("active");if(id==="today")today();if(id==="week")week();if(id==="meals")library();if(id==="shop")shop();if(id==="connect")connect()}
function sums(ids){return ids.map(get).filter(Boolean).reduce((a,m)=>({k:a.k+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{k:0,p:0,c:0,f:0})}
function today(){const i=S.day,ids=S.planned[i]||fallback(i),e=S.eaten[i]||[],t=target(i),a=sums(e),left=t.k-a.k;document.getElementById("today").innerHTML='<div class="hero"><div class="greeting">'+(new Date().getHours()<12?"Good morning":new Date().getHours()<17?"Good afternoon":"Good evening")+', V 👋</div><div class="heroTitle"><h2>'+names[i-1]+'. Let’s make today easy.</h2><span class="status">'+type(i)+'</span></div><p class="muted">'+(S.events.length?"Calendar-aware plan · events imported":"Import your calendar in Connect and VERA will classify the day automatically")+'</p><div class="stats"><div class="stat"><b>'+a.k+'</b><span>of '+t.k+' kcal</span></div><div class="stat"><b>'+a.p+'g</b><span>protein</span></div><div class="stat"><b>'+a.c+'g</b><span>carbs</span></div><div class="stat"><b>'+Math.max(0,left)+'</b><span>kcal left</span></div></div><div class="progress"><div class="bar" style="width:'+Math.min(100,a.k/t.k*100)+'%"></div></div></div><div class="card"><h3>VERA’s nudge</h3><div class="notice">'+(type(i)==="HARD"?"Hard day: keep the carbs in. Performance gets priority.":left>700?"You have <b>"+left+" kcal</b> left. Start with protein, then place carbs around training.":left>0?"You’re on track. Build the next meal around protein and produce.":"You’re around your planned intake. Focus on recovery and hunger — not chasing Garmin burn.")+'</div></div><div class="card"><div class="row"><h3>Today’s meals</h3><button class="ghost" onclick="planMeal()">+ Plan</button></div>'+ids.map(id=>{const m=get(id),done=e.includes(id);return m?'<label class="meal"><input type="checkbox" '+(done?"checked":"")+' onchange="eat(\''+id+'\')"><div><b>'+m.emoji+' '+m.name+'</b><small>'+m.kcal+' kcal · '+m.p+'P · '+m.c+'C · '+m.f+'F</small></div></label>':""}).join("")+'</div><div class="card"><h3>Remaining macros</h3><div class="stats"><div class="stat"><b>'+Math.max(0,left)+'</b><span>kcal</span></div><div class="stat"><b>'+Math.max(0,t.p-a.p)+'g</b><span>protein</span></div><div class="stat"><b>'+Math.max(0,t.c-a.c)+'g</b><span>carbs</span></div><div class="stat"><b>'+Math.max(0,t.f-a.f)+'g</b><span>fat</span></div></div></div>'}
function eat(id){let a=S.eaten[S.day]||[];S.eaten[S.day]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();today()}
function planMeal(){const opts=meals().map(m=>'<option value="'+m.id+'">'+m.emoji+' '+m.name+' — '+m.kcal+' kcal</option>').join("");openModal("Add planned meal",'<div class="field"><label>Meal<select id="pick">'+opts+'</select></label></div><button onclick="S.planned[S.day]=[...(S.planned[S.day]||fallback(S.day)),document.getElementById(\'pick\').value];save();closeModal();today()">Add to today</button>')}
function week(){document.getElementById("week").innerHTML='<div class="hero"><div class="eyebrow">Weekly planning</div><h2>Calendar → day type → food.</h2><p class="muted">Calendar is becoming VERA’s source of truth. Imported events can classify hard / normal / easy days.</p></div>'+names.map((n,i)=>'<div class="card row"><div><b>'+n+'</b><div class="muted">'+type(i+1)+' · '+target(i+1).k+' kcal</div></div><button class="ghost" onclick="S.day='+(i+1)+';save();show(\'today\')">Open</button></div>').join("")}
function library(){const cats=["Breakfast","Lunch","Snacks","Dinner","Dessert"];document.getElementById("meals").innerHTML='<div class="hero"><div class="eyebrow">Meal library</div><h2>Your actual VERA meals.</h2><p class="muted">Restored from the laptop version — and now editable from your phone.</p></div>'+cats.map(c=>'<div class="card"><h3>'+c+'</h3>'+meals().filter(m=>m.cat===c).map(m=>'<div class="recipe"><div class="row"><div><b>'+m.emoji+' '+m.name+'</b><div class="muted">'+m.kcal+' kcal · '+m.p+'P · '+m.c+'C · '+m.f+'F</div></div><button class="ghost" onclick="editMeal(\''+m.id+'\')">Edit</button></div></div>').join("")+'</div>').join("")+'<button class="full" onclick="editMeal()">＋ Add recipe</button>'}
function editMeal(id){const m=id?get(id):{id:"",cat:"Lunch",emoji:"🍽️",name:"",kcal:400,p:30,c:35,f:10,ingredients:[]};openModal(id?"Edit recipe":"Add recipe",'<div class="field"><label>Name<input id="rn" value="'+esc(m.name)+'"></label></div><div class="field"><label>Category<select id="rc">'+["Breakfast","Lunch","Snacks","Dinner","Dessert"].map(c=>'<option '+(c===m.cat?"selected":"")+'>'+c+'</option>').join("")+'</select></label></div><div class="stats"><div class="field"><label>Calories<input id="rk" type="number" value="'+m.kcal+'"></label></div><div class="field"><label>Protein<input id="rp" type="number" value="'+m.p+'"></label></div><div class="field"><label>Carbs<input id="rcc" type="number" value="'+m.c+'"></label></div><div class="field"><label>Fat<input id="rf" type="number" value="'+m.f+'"></label></div></div><div class="field"><label>Ingredients<textarea id="ri" rows="5">'+(m.ingredients||[]).map(x=>x.join(" | ")).join("\n")+'</textarea></label></div><button onclick="saveMeal(\''+(id||"")+'\')">Save recipe</button>')}
function saveMeal(id){const m={id:id||"custom_"+Date.now(),cat:rc.value,emoji:"🍽️",name:rn.value||"New recipe",kcal:+rk.value||0,p:+rp.value||0,c:+rcc.value||0,f:+rf.value||0,ingredients:ri.value.split("\n").filter(Boolean).map(x=>x.split("|").map(y=>y.trim()))};const j=S.customMeals.findIndex(x=>x.id===m.id);if(j>=0)S.customMeals[j]=m;else S.customMeals.push(m);save();closeModal();library();toast("Recipe saved ✓")}
function shop(){const all={};names.forEach((_,i)=>(S.planned[i]||fallback(i)).forEach(id=>{const m=get(id);(m?.ingredients||[]).forEach(x=>{const k=x[0]+"||"+x[1];all[k]=all[k]||{store:x[0],item:x[1],qty:0};all[k].qty+=parseFloat(x[2])||1})}));const arr=Object.values(all);document.getElementById("shop").innerHTML='<div class="hero"><div class="eyebrow">Shopping + prep</div><h2>One list. Less chaos.</h2><p class="muted">Generated from the meals planned across the week.</p></div><div class="card"><h3>Shopping list</h3>'+arr.map(x=>'<label class="meal"><input type="checkbox"><div><b>'+x.item+'</b><small>'+x.store+' · qty guide '+x.qty+'</small></div></label>').join("")+'</div><div class="card"><h3>Sunday prep flow</h3>'+["Cook proteins first.","Start rice/noodles/lasagne while proteins finish.","Wash and chop vegetables.","Portion work lunches and snacks.","Freeze later-week dinners.","Reset the kitchen — future-you will be grateful."].map((x,i)=>'<div class="meal"><b>'+(i+1)+'</b><div>'+x+'</div></div>').join("")+'</div>'}
function connect(){document.getElementById("connect").innerHTML='<div class="hero"><div class="eyebrow">VERA Connect</div><h2>Give VERA the context.</h2><div class="notice"><b>Important:</b> a ChatGPT calendar connection does not automatically feed this public GitHub Pages app. VERA needs an API/backend or an import bridge. We are building the bridge first.</div></div><div class="card"><h3>📅 Calendar</h3><p class="muted">Import an .ics file now. VERA will use event names to classify Easy / Normal / Hard days.</p><button class="full" onclick="importICS()">Import calendar (.ics)</button><p class="muted">'+(S.events.length?S.events.length+" events imported.":"No events imported yet.")+'</p></div><div class="card"><h3>⌚ Garmin</h3><p class="muted">Next: authorised Garmin sync for steps, workouts and recovery context. Your existing Garmin → Apple Health bridge remains useful.</p></div><div class="card"><h3>🥗 MacroFactor</h3><p class="muted">Next: use your existing MacroFactor → Apple Health/Shortcut bridge, then let VERA read actual calories/macros.</p></div><div class="card"><h3>🍎 Apple Health</h3><p class="muted">Direct HealthKit access requires a native iPhone companion. For this web app, your existing Shortcut bridge is the practical route.</p></div>'}
function importICS(){const input=document.createElement("input");input.type="file";input.accept=".ics,text/calendar";input.onchange=async()=>{const txt=await input.files[0].text();S.events=txt.replace(/\r/g,"").split("BEGIN:VEVENT").slice(1).map(b=>{const get=k=>{const l=b.split("\n").find(x=>x.startsWith(k));return l?l.substring(l.indexOf(":")+1):""};const raw=get("DTSTART");return{date:raw.slice(0,8).replace(/(\d{4})(\d{2})(\d{2})/,"$1-$2-$3"),title:get("SUMMARY")||"Calendar event"}}).filter(x=>x.date);save();render();show("connect");toast(S.events.length+" events imported ✓")};input.click()}
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=S.theme;save()}
function openModal(t,b){document.getElementById("modalTitle").textContent=t;document.getElementById("modalBody").innerHTML=b;document.getElementById("modal").classList.add("open")}function closeModal(){document.getElementById("modal").classList.remove("open")}function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}function toast(x){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style="position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:12px;z-index:30";document.body.appendChild(t)}t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1600)}
function render(){document.documentElement.dataset.theme=S.theme;days();nav();today();week();library();shop();connect();show("today")}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
