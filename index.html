<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#17181c;--muted:#747780;--line:#e5e5e9;--accent:#7c5cff;--nav:#fff;--good:#278a62}
[data-theme=dark]{--bg:#111216;--card:#1b1c21;--text:#f4f4f5;--muted:#9b9da7;--line:#2b2d34;--nav:#18191e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;padding-bottom:92px;min-width:320px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.themeBtn{width:42px;height:42px;padding:0;border-radius:14px;background:var(--card);color:var(--text);border:1px solid var(--line);font-size:20px}
header{padding:18px 16px 8px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);z-index:5}
.brand{font-weight:800;font-size:24px}.sub{color:var(--muted);font-size:12px;margin-top:3px}
.days{display:grid;grid-template-columns:repeat(14,minmax(58px,1fr));gap:5px;padding:12px 0 5px;overflow-x:auto;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.day{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 2px;min-width:0;text-align:center;font-weight:700;font-size:12px}.day small{display:block;font-size:8px;opacity:.7;margin-top:2px}.day.active{background:var(--accent);color:white;border-color:var(--accent)}
main{padding:8px 12px;max-width:720px;margin:auto}.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:8px 0 12px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.hero h2{margin:5px 0 14px;font-size:27px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--bg);border-radius:15px;padding:11px 8px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.card h3{margin:0 0 10px;font-size:16px}.meal{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}.meal input{width:20px;height:20px;accent-color:var(--accent)}.meal small{display:block;color:var(--muted);margin-top:2px}
button{font:inherit;border:0;border-radius:12px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:700}.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}.full{width:100%;margin-top:10px}
.progress{height:9px;background:var(--bg);border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:9px}
.section{display:none}.section.active{display:block}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(72px + env(safe-area-inset-bottom));padding:5px 5px calc(5px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--nav) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;z-index:10}nav button{flex:1;background:transparent;color:var(--muted);padding:6px 2px;font-size:10px}nav button.active{color:var(--accent)}nav span{display:block;font-size:21px;margin-bottom:2px}
.recipe{padding:12px 0;border-top:1px solid var(--line)}.pill{display:inline-block;background:var(--bg);padding:5px 8px;border-radius:9px;font-size:11px;margin-right:4px}.notice{padding:12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--card));font-size:13px;line-height:1.45}.greeting{font-size:14px;color:var(--muted);font-weight:600}.heroTitle{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.heroTitle h2{flex:1}.status{font-size:10px;padding:6px 8px;border-radius:999px;background:var(--bg);font-weight:800;white-space:nowrap}.nextMeal{display:flex;gap:12px;align-items:center}.mealIcon{width:46px;height:46px;border-radius:15px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}.nextMeal b{font-size:16px}.nextMeal small{display:block;color:var(--muted);margin-top:3px}.timeline{display:grid;gap:0}.timeRow{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.timeRow:first-child{border-top:0}.activity{display:flex;justify-content:space-between;gap:10px}.metric{background:var(--bg);border-radius:14px;padding:11px;flex:1}.metric b{display:block;font-size:17px}.metric span{font-size:10px;color:var(--muted)}
@media(min-width:700px){nav{position:fixed;top:0;bottom:0;right:auto;width:180px;height:100vh;flex-direction:column;padding:30px 12px}nav button{text-align:left;font-size:13px;padding:13px}nav span{display:inline;margin-right:8px}body{padding-left:180px;padding-bottom:0}header{position:relative}.days{max-width:720px;margin:auto}}
</style>

<header><div class="topbar"><div><div class="brand">VERA</div><div class="sub">V's Everyday Routine Assistant</div></div><button class="themeBtn" onclick="settings()" aria-label="Toggle dark mode">◐</button></div><div class="days" id="days"></div></header>

<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;padding:20px;overflow:auto"><div style="max-width:620px;margin:40px auto;background:var(--card);color:var(--text);border-radius:22px;padding:18px"><div class="row"><h3 id="modalTitle" style="margin:0"></h3><button class="ghost" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><nav id="nav"></nav>
<script>
const KEY="vera_iphone_v2";
const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const defaultMeals=[
{id:"breakfast",cat:"Breakfast",emoji:"🍞",name:"English muffin breakfast sandwich",kcal:378,p:28,c:31,f:16,ingredients:[["Woolies","English muffins",5],["Woolies","Eggs",10],["Woolies","Lean ham",250]]},
{id:"bigmac",cat:"Lunch",emoji:"🍔",name:"Big Mac beef bowl",kcal:510,p:42,c:50,f:15,ingredients:[["Woolies","Extra-lean beef mince",900],["Woolies","Lettuce",2],["Woolies","Cucumber",2],["Woolies","Pickles",1],["Woolies","Light mayo",1]]},
{id:"greek",cat:"Lunch",emoji:"🇬🇷",name:"Greek chicken bowl",kcal:450,p:47,c:40,f:11,ingredients:[["Woolies","Shredded chicken breast",750],["Woolies","Lettuce",2],["Woolies","Cucumber",2],["Woolies","Tomatoes",6],["Woolies","Tzatziki",1]]},
{id:"kfc",cat:"Lunch",emoji:"🥗",name:"KFC-style crunch bowl",kcal:367,p:16,c:33,f:19,ingredients:[["Woolies","Chicken breast",500],["Woolies","Lettuce",2],["Woolies","Corn",1],["Woolies","Light dressing",1]]},
{id:"beefroll",cat:"Lunch",emoji:"🌯",name:"Big Mac beef rice-paper rolls",kcal:520,p:40,c:50,f:14,ingredients:[["Woolies","Extra-lean beef mince",900],["Woolies","Rice paper",15],["Woolies","Lettuce",2],["Woolies","Cucumber",2],["Woolies","Pickles",1]]},
{id:"carrots",cat:"Snacks",emoji:"🥕",name:"Carrots + tzatziki",kcal:76,p:3,c:5,f:3,ingredients:[["Woolies","Carrots",1],["Woolies","Tzatziki",1]]},
{id:"yopro",cat:"Snacks",emoji:"🥛",name:"YoPRO strawberry",kcal:119,p:20,c:7,f:1,ingredients:[["Woolies","YoPRO yoghurt",5]]},
{id:"banana",cat:"Snacks",emoji:"🍌",name:"Banana",kcal:100,p:1,c:23,f:0,ingredients:[["Woolies","Bananas",10]]},
{id:"lasagne",cat:"Dinner",emoji:"🍝",name:"High-protein beef lasagne",kcal:627,p:51,c:50,f:24,ingredients:[["Woolies","Extra-lean beef mince",1000],["Woolies","Lasagne sheets",1],["Woolies","Passata",2],["Woolies","Light cheese",1]]},
{id:"stirfry",cat:"Dinner",emoji:"🍜",name:"Beef stir-fry noodles",kcal:485,p:55,c:33,f:15,ingredients:[["Woolies","Lean beef",750],["Woolies","Noodles",5],["Woolies","Stir-fry vegetables",3],["Woolies","Stir-fry sauce",1]]},
{id:"friedrice",cat:"Dinner",emoji:"🍚",name:"Chicken fried rice",kcal:520,p:45,c:58,f:12,ingredients:[["Woolies","Shredded chicken breast",750],["Woolies","Microwave rice",5],["Woolies","Frozen vegetables",2],["Woolies","Eggs",5]]},
{id:"berry",cat:"Dessert",emoji:"🍓",name:"Berry yoghurt bowl",kcal:251,p:31,c:24,f:3,ingredients:[["Woolies","Greek yoghurt",1],["Woolies","Frozen berries",1]]},
{id:"creami",cat:"Dessert",emoji:"🍦",name:"Strawberry cheesecake CREAMi",kcal:235,p:22,c:25,f:3,ingredients:[["Woolies","High-protein yoghurt",5],["Woolies","Skim milk",1],["Woolies","Frozen strawberries",1]]}];
const old=JSON.parse(localStorage.getItem("vera_iphone_v1")||"null");
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{day:old?.day||(new Date().getDay()+1),theme:old?.theme||"light",customMeals:[],planned:{},eaten:{},events:[]};
S.customMeals=S.customMeals||[];S.planned=S.planned||{};S.eaten=S.eaten||{};S.events=S.events||[];S.weekPlan=S.weekPlan||{};
const meals=()=>[...defaultMeals,...S.customMeals];
const fallback=i=>new Date(dayDate(i)+"T12:00").getDay()===6?["banana","breakfast","greek","carrots","stirfry","berry"]:["banana","breakfast","bigmac","carrots","lasagne","berry"];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function get(id){return meals().find(m=>m.id===id)}
function dayDate(i){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(i-1));return d.toISOString().slice(0,10)}
function type(i){const date=dayDate(i);const es=S.events.filter(e=>e.date===date);const t=es.map(e=>e.title).join(" ").toLowerCase();if(/leave|holiday|rest|recovery/.test(t)&&!/fitstop|hyrox|turf|training|gym|coaching|perform|build|peak|sweat|competition|comp/.test(t))return"EASY";if(/fitstop|hyrox|turf|training|gym|coaching|perform|build|peak|sweat|competition|comp/.test(t))return"HARD";const dow=new Date(date+"T12:00").getDay();return dow===0?"EASY":dow===6?"HARD":"NORMAL"}
function target(i){return type(i)==="HARD"?{k:1950,p:160,c:200,f:55}:type(i)==="EASY"?{k:1800,p:160,c:160,f:55}:{k:1850,p:160,c:175,f:55}}
function nav(){document.getElementById("nav").innerHTML=[["today","⌂","Today"],["week","▦","Week"],["calendar","📅","Calendar"],["meals","◉","Meals"],["shop","🛒","Shop"],["connect","⚙","Connect"]].map(x=>'<button onclick="show(\''+x[0]+'\')" id="n-'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join("")}
function days(){document.getElementById("days").innerHTML=Array.from({length:14},(_,j)=>{const i=j+1,d=new Date(dayDate(i)+"T12:00"),n=names[d.getDay()];return '<button class="day '+(S.day===i?"active":"")+'" onclick="S.day='+i+';save();render()"><b>'+n+'</b><small>'+d.getDate()+' '+d.toLocaleDateString(undefined,{month:"short"})+'</small><small>'+type(i)+'</small></button>'}).join("")}
function show(id){document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById("n-"+id).classList.add("active");if(id==="today")today();if(id==="week")week();if(id==="meals")library();if(id==="shop")shop();if(id==="calendar")calendar();if(id==="connect")connect()}
function sums(ids){return ids.map(get).filter(Boolean).reduce((a,m)=>({k:a.k+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{k:0,p:0,c:0,f:0})}
function today(){const i=S.day,ids=S.planned[i]||fallback(i),e=S.eaten[i]||[],t=target(i),a=sums(e),left=t.k-a.k;document.getElementById("today").innerHTML='<div class="hero"><div class="greeting">'+(new Date().getHours()<12?"Good morning":new Date().getHours()<17?"Good afternoon":"Good evening")+', V 👋</div><div class="heroTitle"><h2>'+names[i-1]+'. Let’s make today easy.</h2><span class="status">'+type(i)+'</span></div><p class="muted">'+(S.events.length?"Calendar-aware plan · events imported":"Import your calendar in Connect and VERA will classify the day automatically")+'</p><div class="stats"><div class="stat"><b>'+a.k+'</b><span>of '+t.k+' kcal</span></div><div class="stat"><b>'+a.p+'g</b><span>protein</span></div><div class="stat"><b>'+a.c+'g</b><span>carbs</span></div><div class="stat"><b>'+Math.max(0,left)+'</b><span>kcal left</span></div></div><div class="progress"><div class="bar" style="width:'+Math.min(100,a.k/t.k*100)+'%"></div></div></div><div class="card"><h3>VERA’s nudge</h3><div class="notice">'+(type(i)==="HARD"?"Hard day: keep the carbs in. Performance gets priority.":left>700?"You have <b>"+left+" kcal</b> left. Start with protein, then place carbs around training.":left>0?"You’re on track. Build the next meal around protein and produce.":"You’re around your planned intake. Focus on recovery and hunger — not chasing Garmin burn.")+'</div></div><div class="card"><div class="row"><h3>Today’s meals</h3><button class="ghost" onclick="weeklyReset()">Plan Week</button></div>'+ids.map(id=>{const m=get(id),done=e.includes(id);return m?'<label class="meal"><input type="checkbox" '+(done?"checked":"")+' onchange="eat(\''+id+'\')"><div><b>'+m.emoji+' '+m.name+'</b><small>'+m.kcal+' kcal · '+m.p+'P · '+m.c+'C · '+m.f+'F</small></div></label>':""}).join("")+'</div><div class="card"><h3>Remaining macros</h3><div class="stats"><div class="stat"><b>'+Math.max(0,left)+'</b><span>kcal</span></div><div class="stat"><b>'+Math.max(0,t.p-a.p)+'g</b><span>protein</span></div><div class="stat"><b>'+Math.max(0,t.c-a.c)+'g</b><span>carbs</span></div><div class="stat"><b>'+Math.max(0,t.f-a.f)+'g</b><span>fat</span></div></div></div>'}
function eat(id){let a=S.eaten[S.day]||[];S.eaten[S.day]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();today()}
function weeklyReset(){openModal("Friday Weekly Reset",'<div class="notice"><b>Plan next week, Sunday → Saturday.</b><br>Before building your plan, make sure your Apple Calendar includes work, Fitstop training, Fitstop coaching, other training, social plans, rest and leave.</div><div class="card"><h3>Calendar checklist</h3><div class="meal">☐ Normal work</div><div class="meal">☐ Fitstop training</div><div class="meal">☐ Fitstop coaching</div><div class="meal">☐ Other training / Hyrox</div><div class="meal">☐ Social plans</div><div class="meal">☐ Rest / recovery</div><div class="meal">☐ Leave / travel</div></div><button class="full" onclick="closeModal();show(\'calendar\')">Review calendar</button><button class="full" onclick="closeModal();buildNextWeek()">Build my week</button>')}
function nextWeekDate(offset){const d=new Date();d.setHours(12,0,0,0);const dow=d.getDay();d.setDate(d.getDate()+(7-dow)+offset);return d.toISOString().slice(0,10)}
function nextWeekLabel(offset){const d=new Date(nextWeekDate(offset)+"T12:00");return d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"})}
function nextWeekEvents(date){return S.events.filter(e=>e.date===date)}
function nextWeekType(offset){const date=nextWeekDate(offset);const t=nextWeekEvents(date).map(e=>e.title).join(" ").toLowerCase();if(/leave|holiday|rest|recovery/.test(t)&&!/fitstop|hyrox|turf|training|gym|coaching|perform|build|peak|sweat|competition|comp/.test(t))return"EASY";if(/fitstop|hyrox|turf|training|gym|coaching|perform|build|peak|sweat|competition|comp/.test(t))return"HARD";return offset===0?"EASY":"NORMAL"}
function nextWeekTarget(offset){const x=nextWeekType(offset);return x==="HARD"?{k:1950,p:160,c:200,f:55}:x==="EASY"?{k:1800,p:160,c:160,f:55}:{k:1850,p:160,c:175,f:55}}
function macroFactorMeal(id){return String(id||"").startsWith("mf_")}function preferMacroFactor(ids,offset){return ids.map((id,j)=>{const base=get(id);if(!base)return id;const pool=meals().filter(m=>macroFactorMeal(m.id)&&m.cat===base.cat);return pool.length?pool[(offset+j)%pool.length].id:id})}function mealSetFor(type,offset){const sets={EASY:[["breakfast","greek","yopro","carrots","stirfry","berry","banana"],["breakfast","bigmac","yopro","carrots","lasagne","creami","banana"],["breakfast","greek","yopro","carrots","friedrice","berry","banana"]],NORMAL:[["breakfast","bigmac","yopro","carrots","friedrice","berry"],["breakfast","greek","yopro","carrots","stirfry","creami"],["breakfast","beefroll","yopro","carrots","friedrice","berry"]],HARD:[["breakfast","beefroll","yopro","carrots","friedrice","creami","banana"],["breakfast","bigmac","yopro","carrots","stirfry","berry","banana"],["breakfast","greek","yopro","carrots","lasagne","creami","banana"]]};return preferMacroFactor(sets[type][offset%sets[type].length],offset)}
function comboTotals(ids){return sums(ids)}
function buildNextWeek(){const rows=[0,1,2,3,4,5,6].map(i=>{const typ=nextWeekType(i),ids=mealSetFor(typ,i),a=comboTotals(ids),t=nextWeekTarget(i),events=nextWeekEvents(nextWeekDate(i));return '<div class="meal"><div style="width:100%"><div class="row"><div><b>'+nextWeekLabel(i)+' · '+typ+'</b><small>'+t.k+' kcal target · '+a.k+' kcal planned</small></div><span class="pill">'+a.p+'P</span></div><small>'+ids.map(id=>get(id)?.name).filter(Boolean).join(' · ')+'</small>'+(events.length?'<small>📅 '+events.map(e=>esc(e.title)).join(' · ')+'</small>':"")+'</div></div>'}).join("");openModal("Next Week Meal Plan",'<div class="notice"><b>VERA has built the week around your calendar.</b><br>Hard days get more carbs, easy days stay lighter, and the meals are designed around your one weekly prep.</div><div class="card"><h3>Sunday → Saturday</h3>'+rows+'</div><div class="card"><h3>Meal-prep strategy</h3><p class="muted">Breakfast and snacks repeat for simplicity. Lunches rotate between your bowls/rolls. Dinners favour freezer-friendly meals, with higher-carb options placed on harder training days.</p></div><button class="full" onclick="lockNextWeek()">🔒 Lock next week</button><button class="full ghost" onclick="closeModal()">Keep suggestion</button>')}
function lockNextWeek(){S.weekPlan={};[0,1,2,3,4,5,6].forEach(i=>{const date=nextWeekDate(i),ids=mealSetFor(nextWeekType(i),i);S.weekPlan[date]=ids});S.weekLocked=true;save();closeModal();render();toast("Next week locked in ✓")}
function planMeal(){const opts=meals().map(m=>'<option value="'+m.id+'">'+m.emoji+' '+m.name+' — '+m.kcal+' kcal</option>').join("");openModal("Add planned meal",'<div class="field"><label>Meal<select id="pick">'+opts+'</select></label></div><button onclick="S.planned[S.day]=[...(S.planned[S.day]||fallback(S.day)),document.getElementById(\'pick\').value];save();closeModal();today()">Add to today</button>')}
function week(){document.getElementById("week").innerHTML='<div class="hero"><div class="eyebrow">14-day planning</div><h2>Today → the next two weeks.</h2><p class="muted">VERA keeps a rolling 14-day calendar. Sync again anytime to update events already in the current window and bring in the days ahead.</p></div>'+Array.from({length:14},(_,j)=>{const i=j+1,d=new Date(dayDate(i)+"T12:00"),label=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});return '<div class="card row"><div><b>'+label+'</b><div class="muted">'+type(i)+' · '+target(i).k+' kcal</div></div><button class="ghost" onclick="S.day='+i+';save();show(\'today\')">Open</button></div>'}).join("")}
function addRecipeToSelectedDay(id){S.planned[S.day]=[...(S.planned[S.day]||fallback(S.day)),id];save();toast("Added to "+names[new Date(dayDate(S.day)+"T12:00").getDay()]+" ✓");library()}
function importRecipes(){openModal("Import MacroFactor recipes",'<div class="notice"><b>Best option:</b> upload a recipe file or paste the recipe details. VERA stores ingredients, macros and category so they can be used in meal planning and the shopping list.</div><button class="full" onclick="pickRecipeFile()">📥 Upload recipe file</button><button class="full ghost" onclick="pasteRecipe()">📋 Paste recipe details</button><p class="muted">MacroFactor custom recipes are shareable through recipe links, while its general data export is spreadsheet-based; there is not a documented dedicated recipe-export format, so VERA supports file/paste import for now.</p>')}
function pickRecipeFile(){const input=document.createElement("input");input.type="file";input.accept=".json,.csv,.txt,.tsv,text/csv,application/json,text/plain";input.onchange=async()=>{const file=input.files[0];if(!file)return;const text=await file.text();let added=0;try{if(file.name.toLowerCase().endsWith(".json")){const data=JSON.parse(text);const arr=Array.isArray(data)?data:(data.recipes||data.data||[]);arr.forEach(x=>{if(saveImportedRecipe(x))added++})}else{const lines=text.replace(/\r/g,"").split("\n").filter(Boolean);if(lines.length>1){const head=parseCSVLine(lines[0]).map(x=>x.trim().toLowerCase());lines.slice(1).forEach(line=>{const vals=parseCSVLine(line),x={};head.forEach((h,i)=>x[h]=vals[i]||"");if(saveImportedRecipe(x))added++})}}}catch(e){console.error(e)}save();closeModal();library();toast(added+" recipes imported ✓")};input.click()}
function parseCSVLine(line){const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==="\""&&line[i+1]==="\""){cur+="\"";i++;continue}if(ch==="\""){q=!q;continue}if((ch===","||ch==="\\t")&&!q){out.push(cur);cur="";continue}cur+=ch}out.push(cur);return out}
function normNum(v){const n=parseFloat(String(v||"").replace(/[^0-9.-]/g,""));return Number.isFinite(n)?n:0}
function saveImportedRecipe(x){const name=x.name||x.title||x.recipe||x["recipe name"]||x["food name"];if(!name)return false;const catRaw=String(x.category||x.cat||x.type||"Dinner").toLowerCase();const cat=/snack/.test(catRaw)?"Snacks":/breakfast/.test(catRaw)?"Breakfast":/lunch/.test(catRaw)?"Lunch":/dessert|sweet/.test(catRaw)?"Dessert":"Dinner";let ing=x.ingredients||x.ingredient||x.items||"";let ingredients=[];if(Array.isArray(ing))ingredients=ing.map(a=>Array.isArray(a)?a:["Woolies",String(a),1]);else ingredients=String(ing).split(/\n|;|\|/).map(s=>s.trim()).filter(Boolean).map(s=>["Woolies",s,1]);const m={id:"mf_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),cat,emoji:cat==="Snacks"?"🍿":cat==="Breakfast"?"🥣":cat==="Lunch"?"🥗":cat==="Dessert"?"🍓":"🍽️",name:String(name),kcal:normNum(x.kcal||x.calories||x["calories per serving"]),p:normNum(x.p||x.protein||x["protein (g)"]),c:normNum(x.c||x.carbs||x.carbohydrates||x["carbs (g)"]),f:normNum(x.f||x.fat||x["fat (g)"]),ingredients};S.customMeals.push(m);return true}
function pasteRecipe(){openModal("Paste MacroFactor recipe",'<div class="notice">Paste one recipe in this format. You can repeat the block for multiple recipes.</div><textarea id="recipePaste" rows="14" style="width:100%;margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)">Name: 
Category: Snacks
Calories: 
Protein: 
Carbs: 
Fat: 
Ingredients:
100 g example ingredient
1 example ingredient</textarea><button class="full" onclick="parsePastedRecipes()">Import recipe(s)</button>')}
function parsePastedRecipes(){const blocks=recipePaste.value.split(/\n\s*\n|\n---+\n/).map(x=>x.trim()).filter(Boolean);let added=0;blocks.forEach(b=>{const lines=b.split("\n"),x={ingredients:[]};let ing=false;lines.forEach(line=>{const m=line.match(/^\s*([^:]+):\s*(.*)$/);if(m){const k=m[1].toLowerCase().trim(),v=m[2].trim();if(k==="ingredients"){ing=true;return}ing=false;if(k==="name")x.name=v;else if(k==="category")x.category=v;else if(k==="calories")x.calories=v;else if(k==="protein")x.protein=v;else if(k==="carbs"||k==="carbohydrates")x.carbs=v;else if(k==="fat")x.fat=v}else if(ing&&line.trim())x.ingredients.push(line.trim())});if(saveImportedRecipe(x))added++});save();closeModal();library();toast(added+" recipe(s) imported ✓")}
function library(){const cats=["Breakfast","Lunch","Snacks","Dinner","Dessert"];document.getElementById("meals").innerHTML='<div class="hero"><div class="eyebrow">Meal library</div><h2>Your actual VERA meals.</h2><p class="muted">Your VERA meals plus MacroFactor recipes, including snacks, all available to the planner and shopping list.</p><button class="full" onclick="importRecipes()">📥 Import MacroFactor recipes</button></div>'+cats.map(c=>'<div class="card"><h3>'+c+'</h3>'+meals().filter(m=>m.cat===c).map(m=>'<div class="recipe"><div class="row"><div><b>'+m.emoji+' '+m.name+'</b><div class="muted">'+m.kcal+' kcal · '+m.p+'P · '+m.c+'C · '+m.f+'F</div></div><div><button class="ghost" onclick="addRecipeToSelectedDay(\''+m.id+'\')">Plan</button><button class="ghost" onclick="editMeal(\''+m.id+'\')">Edit</button></div></div></div>').join("")+'</div>').join("")+'<button class="full" onclick="editMeal()">＋ Add recipe</button>'}
function editMeal(id){const m=id?get(id):{id:"",cat:"Lunch",emoji:"🍽️",name:"",kcal:400,p:30,c:35,f:10,ingredients:[]};openModal(id?"Edit recipe":"Add recipe",'<div class="field"><label>Name<input id="rn" value="'+esc(m.name)+'"></label></div><div class="field"><label>Category<select id="rc">'+["Breakfast","Lunch","Snacks","Dinner","Dessert"].map(c=>'<option '+(c===m.cat?"selected":"")+'>'+c+'</option>').join("")+'</select></label></div><div class="stats"><div class="field"><label>Calories<input id="rk" type="number" value="'+m.kcal+'"></label></div><div class="field"><label>Protein<input id="rp" type="number" value="'+m.p+'"></label></div><div class="field"><label>Carbs<input id="rcc" type="number" value="'+m.c+'"></label></div><div class="field"><label>Fat<input id="rf" type="number" value="'+m.f+'"></label></div></div><div class="field"><label>Ingredients<textarea id="ri" rows="5">'+(m.ingredients||[]).map(x=>x.join(" | ")).join("\n")+'</textarea></label></div><button onclick="saveMeal(\''+(id||"")+'\')">Save recipe</button>')}
function saveMeal(id){const m={id:id||"custom_"+Date.now(),cat:rc.value,emoji:"🍽️",name:rn.value||"New recipe",kcal:+rk.value||0,p:+rp.value||0,c:+rcc.value||0,f:+rf.value||0,ingredients:ri.value.split("\n").filter(Boolean).map(x=>x.split("|").map(y=>y.trim()))};const j=S.customMeals.findIndex(x=>x.id===m.id);if(j>=0)S.customMeals[j]=m;else S.customMeals.push(m);save();closeModal();library();toast("Recipe saved ✓")}
function calendar(){const by={};S.events.forEach(e=>(by[e.date]??=[]).push(e));const rows=Array.from({length:14},(_,j)=>{const i=j+1,d=dayDate(i),es=by[d]||[];const dt=new Date(d+"T12:00");const label=dt.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});return '<div class="card"><div class="row"><div><b>'+label+'</b><div class="muted">'+type(i)+' · '+target(i).k+' kcal</div></div><button class="ghost" onclick="S.day='+i+';save();show("today")">Plan</button></div>'+(es.length?'<div class="timeline">'+es.map(e=>'<div class="timeRow"><div class="muted">'+((e.start||"").match(/at\\s*(.*)$/i)?.[1]||e.start||"")+'</div><div><b>'+esc(e.title)+'</b>'+(e.end?'<div class="muted">until '+esc(e.end)+'</div>':"")+'</div></div>').join("")+'</div>':'<p class="muted">No imported events.</p>')+'</div>'});document.getElementById("calendar").innerHTML='<div class="hero"><div class="eyebrow">Apple Calendar</div><h2>Your week at a glance.</h2><p class="muted">VERA is using your imported Apple Calendar events to plan your days.</p><div class="notice">'+(S.events.length?'<b>'+S.events.length+' events imported.</b> Tap a day to jump straight to its meal plan.':'No calendar events imported yet. Run VERA — Sync Calendar on your iPhone.')+'</div></div>'+rows.join("")}
function shop(){const all={};const planIds=[];if(S.weekLocked&&S.weekPlan)Object.values(S.weekPlan).forEach(ids=>planIds.push(...ids));Array.from({length:14},(_,j)=>j+1).forEach(i=>(S.planned[i]||fallback(i)).forEach(id=>planIds.push(id)));planIds.forEach(id=>{const m=get(id);(m?.ingredients||[]).forEach(x=>{const k=x[0]+"||"+x[1];all[k]=all[k]||{store:x[0],item:x[1],qty:0};all[k].qty+=parseFloat(x[2])||1})});const arr=Object.values(all);document.getElementById("shop").innerHTML='<div class="hero"><div class="eyebrow">Shopping + prep</div><h2>One list. Less chaos.</h2><p class="muted">Generated from your locked meal plan, daily plans and imported MacroFactor recipes — snacks included.</p></div><div class="card"><h3>Shopping list</h3>'+arr.map(x=>'<label class="meal"><input type="checkbox"><div><b>'+x.item+'</b><small>'+x.store+' · qty guide '+x.qty+'</small></div></label>').join("")+'</div><div class="card"><h3>Sunday prep flow</h3>'+["Cook proteins first.","Start rice/noodles/lasagne while proteins finish.","Wash and chop vegetables.","Portion work lunches and snacks.","Freeze later-week dinners.","Reset the kitchen — future-you will be grateful."].map((x,i)=>'<div class="meal"><b>'+(i+1)+'</b><div>'+x+'</div></div>').join("")+'</div>'}
function connect(){document.getElementById("connect").innerHTML='<div class="hero"><div class="eyebrow">VERA Connect</div><h2>Give VERA the context.</h2><div class="notice"><b>Important:</b> a ChatGPT calendar connection does not automatically feed this public GitHub Pages app. VERA needs an API/backend or an import bridge. We are building the bridge first.</div></div><div class="card"><h3>📅 Calendar</h3><p class="muted">Import an .ics file now. VERA will use event names to classify Easy / Normal / Hard days.</p><button class="full" onclick="importICS()">Import calendar (.ics)</button><p class="muted">'+(S.events.length?S.events.length+" events imported.":"No events imported yet.")+'</p></div><div class="card"><h3>⌚ Garmin</h3><p class="muted">Next: authorised Garmin sync for steps, workouts and recovery context. Your existing Garmin → Apple Health bridge remains useful.</p></div><div class="card"><h3>🥗 MacroFactor recipes</h3><p class="muted">Import your recipes into VERA so their calories, macros and ingredients become available to the planner and shopping list.</p><button class="full" onclick="show('meals')">Open recipe library</button></div><div class="card"><h3>🍎 Apple Health</h3><p class="muted">Direct HealthKit access requires a native iPhone companion. For this web app, your existing Shortcut bridge is the practical route.</p></div>'}
function importCalendarText(raw){const text=String(raw||"").replace(/\\+/g," ").trim();const lines=text.split(/\n|\r/).map(x=>x.trim()).filter(Boolean);const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};S.events=lines.map(line=>{const p=line.split("|").map(x=>x.trim());const start=p[1]||"";let date="";let m=start.match(/(\d{4})[-\/]([0-9]{1,2})[-\/]([0-9]{1,2})/);if(m)date=m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");else{m=start.match(/([0-9]{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})/);if(m&&months[m[2].slice(0,3).toLowerCase()])date=m[3]+"-"+String(months[m[2].slice(0,3).toLowerCase()]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0")}return{date,title:p[0]||"Calendar event",start,end:p[2]||""}}).filter(x=>x.date);save();render()}
function importICS(){const input=document.createElement("input");input.type="file";input.accept=".ics,text/calendar";input.onchange=async()=>{const txt=await input.files[0].text();S.events=txt.replace(/\r/g,"").split("BEGIN:VEVENT").slice(1).map(b=>{const get=k=>{const l=b.split("\n").find(x=>x.startsWith(k));return l?l.substring(l.indexOf(":")+1):""};const raw=get("DTSTART");return{date:raw.slice(0,8).replace(/(\d{4})(\d{2})(\d{2})/,"$1-$2-$3"),title:get("SUMMARY")||"Calendar event"}}).filter(x=>x.date);save();render();show("connect");toast(S.events.length+" events imported ✓")};input.click()}
function settings(){toggleTheme()}function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=S.theme;save()}
function openModal(t,b){const modal=document.getElementById("modal");if(!modal)return;document.getElementById("modalTitle").textContent=t;document.getElementById("modalBody").innerHTML=b;document.getElementById("modal").style.display="block"}function closeModal(){const modal=document.getElementById("modal");if(modal)modal.style.display="none"}function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}function toast(x){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style="position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:12px;z-index:30";document.body.appendChild(t)}t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1600)}
function render(){document.documentElement.dataset.theme=S.theme;days();nav();today();week();library();shop();connect();show("today")}
(function(){const q=new URLSearchParams(location.search).get("calendar");if(q){try{importCalendarText(q);history.replaceState({},document.title,location.pathname)}catch(e){console.error(e)}}})();
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
