<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17181c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VERA">
<link rel="manifest" href="manifest.json">
<title>VERA — V's Everyday Routine Assistant</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#17181c;--muted:#747780;--line:#e5e5e9;--accent:#7c5cff;--nav:#fff;--good:#278a62}
[data-theme=dark]{--bg:#111216;--card:#1b1c21;--text:#f4f4f5;--muted:#9b9da7;--line:#2b2d34;--nav:#18191e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;padding-bottom:92px;min-width:320px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.themeBtn{width:42px;height:42px;padding:0;border-radius:14px;background:var(--card);color:var(--text);border:1px solid var(--line);font-size:20px}
header{padding:18px 16px 8px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);z-index:5}
.brand{font-weight:800;font-size:24px}.sub{color:var(--muted);font-size:12px;margin-top:3px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:12px 0 5px}.day{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 2px;min-width:0;text-align:center;font-weight:700;font-size:12px}.day small{display:block;font-size:8px;opacity:.7;margin-top:2px}.day.active{background:var(--accent);color:white;border-color:var(--accent)}
main{padding:8px 12px;max-width:720px;margin:auto}.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:8px 0 12px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.hero h2{margin:5px 0 14px;font-size:27px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--bg);border-radius:15px;padding:11px 8px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.card h3{margin:0 0 10px;font-size:16px}.meal{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}.meal input{width:20px;height:20px;accent-color:var(--accent)}.meal small{display:block;color:var(--muted);margin-top:2px}
button{font:inherit;border:0;border-radius:12px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:700}.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}.full{width:100%;margin-top:10px}
.progress{height:9px;background:var(--bg);border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:9px}
.section{display:none}.section.active{display:block}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(72px + env(safe-area-inset-bottom));padding:5px 5px calc(5px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--nav) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;z-index:10}nav button{flex:1;background:transparent;color:var(--muted);padding:6px 2px;font-size:10px}nav button.active{color:var(--accent)}nav span{display:block;font-size:21px;margin-bottom:2px}
.recipe{padding:12px 0;border-top:1px solid var(--line)}.pill{display:inline-block;background:var(--bg);padding:5px 8px;border-radius:9px;font-size:11px;margin-right:4px}.notice{padding:12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--card));font-size:13px;line-height:1.45}.greeting{font-size:14px;color:var(--muted);font-weight:600}.heroTitle{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.heroTitle h2{flex:1}.status{font-size:10px;padding:6px 8px;border-radius:999px;background:var(--bg);font-weight:800;white-space:nowrap}.nextMeal{display:flex;gap:12px;align-items:center}.mealIcon{width:46px;height:46px;border-radius:15px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}.nextMeal b{font-size:16px}.nextMeal small{display:block;color:var(--muted);margin-top:3px}.timeline{display:grid;gap:0}.timeRow{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.timeRow:first-child{border-top:0}.activity{display:flex;justify-content:space-between;gap:10px}.metric{background:var(--bg);border-radius:14px;padding:11px;flex:1}.metric b{display:block;font-size:17px}.metric span{font-size:10px;color:var(--muted)}
@media(min-width:700px){nav{position:fixed;top:0;bottom:0;right:auto;width:180px;height:100vh;flex-direction:column;padding:30px 12px}nav button{text-align:left;font-size:13px;padding:13px}nav span{display:inline;margin-right:8px}body{padding-left:180px;padding-bottom:0}header{position:relative}.days{max-width:720px;margin:auto}}
</style>
</head>
<body>
<header><div class="topbar"><div><div class="brand">VERA</div><div class="sub">V's Everyday Routine Assistant</div></div><button class="themeBtn" onclick="settings()" aria-label="Toggle dark mode">◐</button></div><div class="days" id="days"></div></header>
<main>
<section id="today" class="section active"></section>
<section id="week" class="section"></section>
<section id="meals" class="section"></section>
<section id="shop" class="section"></section>
<section id="connect" class="section"></section>
</main>
<nav id="nav"></nav>
<script>
const KEY="vera_iphone_v1";
const defaultState={day:new Date().getDay()||7,theme:"light",done:{},meals:[
{name:"Protein oats",type:"Breakfast",cal:420,p:35,c:52,f:9},
{name:"Chicken rice bowl",type:"Lunch",cal:510,p:48,c:58,f:10},
{name:"Greek yoghurt + fruit",type:"Snack",cal:220,p:20,c:28,f:3},
{name:"Big Mac style bowl",type:"Dinner",cal:560,p:45,c:48,f:18}
],targets:{cal:1850,p:160,c:175,f:55}};
let S=JSON.parse(localStorage.getItem(KEY)||"null")||defaultState;
const names=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function dayName(){return names[(S.day-1+7)%7]}
function nav(){document.getElementById("nav").innerHTML=[["today","⌂","Today"],["week","▦","Week"],["meals","◉","Meals"],["shop","🛒","Shop"],["connect","⚙","Connect"]].map(x=>'<button onclick="show(\''+x[0]+'\')" id="n-'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join("")}
function days(){document.getElementById("days").innerHTML=names.map((n,i)=>'<button class="day '+(S.day===i+1?'active':'')+'" onclick="S.day='+(i+1)+';save();render()"><b>'+n+'</b><small>'+(i===5?'HARD':i===6?'EASY':'NORMAL')+'</small></button>').join("")}
function show(id){document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById("n-"+id).classList.add("active");renderSection(id)}
function renderSection(id){if(id==="today")today();if(id==="week")week();if(id==="meals")mealLibrary();if(id==="shop")shop();if(id==="connect")connect()}
function today(){
 const eaten=S.meals.filter((m,i)=>S.done[S.day+"-"+i]).reduce((a,m)=>({cal:a.cal+m.cal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{cal:0,p:0,c:0,f:0});
 const left=Math.max(0,S.targets.cal-eaten.cal), pct=Math.min(100,Math.round(eaten.cal/S.targets.cal*100));
 const nextIndex=S.meals.findIndex((m,i)=>!S.done[S.day+"-"+i]); const next=S.meals[nextIndex<0?0:nextIndex];
 const hard=S.day===6, type=hard?"HARD":"NORMAL";
 const hour=new Date().getHours(); const greeting=hour<12?"Good morning":hour<17?"Good afternoon":"Good evening";
 document.getElementById("today").innerHTML=
 '<div class="hero"><div class="greeting">'+greeting+', V 👋</div><div class="heroTitle"><h2>'+dayName()+'. Let’s make today easy.</h2><span class="status">'+type+'</span></div><p class="muted" style="margin:0 0 14px">Your plan at a glance. VERA will keep the decisions simple.</p><div class="stats"><div class="stat"><b>'+eaten.cal+'</b><span>of '+S.targets.cal+' kcal</span></div><div class="stat"><b>'+eaten.p+'g</b><span>protein</span></div><div class="stat"><b>'+eaten.c+'g</b><span>carbs</span></div><div class="stat"><b>'+eaten.f+'g</b><span>fat</span></div></div><div class="progress" style="margin-top:14px"><div class="bar" style="width:'+pct+'%"></div></div><div class="activity" style="margin-top:10px"><div class="metric"><b>—</b><span>steps</span></div><div class="metric"><b>—</b><span>training</span></div><div class="metric"><b>'+left+'</b><span>kcal left</span></div></div></div>'+
 '<div class="card" style="margin-bottom:10px"><h3>Next up</h3><div class="nextMeal"><div class="mealIcon">🍽️</div><div><b>'+next.name+'</b><small>'+next.cal+' kcal · '+next.p+'g protein · '+next.c+'g carbs</small></div></div><button class="full" onclick="toggleMeal('+(nextIndex<0?0:nextIndex)+')">'+(nextIndex<0?'All meals logged ✓':'Mark as eaten')+'</button></div>'+
 '<div class="card" style="margin-bottom:10px"><h3>Today’s timeline</h3><div class="timeline"><div class="timeRow"><div class="time">AM</div><div><b>Start the day</b><div class="muted">Hydrate · check today’s plan · breakfast</div></div></div><div class="timeRow"><div class="time">MID</div><div><b>Fuel + focus</b><div class="muted">Lunch · steps · workday rhythm</div></div></div><div class="timeRow"><div class="time">PM</div><div><b>Finish strong</b><div class="muted">Training/recovery · dinner · prep tomorrow</div></div></div></div></div>'+
 '<div class="card" style="margin-bottom:10px"><h3>VERA’s nudge</h3><div class="notice">'+(left>700?'You have <b>'+left+' kcal</b> left. Start with protein, then place carbs around training.':left>0?'You’re on track. Build your next meal around protein and produce.':'You’re at your planned calories. No need to chase Garmin burn — focus on recovery and hunger.')+'</div></div>'+
 '<div class="card"><h3>Today’s meals</h3>'+S.meals.map((m,i)=>'<label class="meal"><input type="checkbox" '+(S.done[S.day+"-"+i]?"checked":"")+' onchange="toggleMeal('+i+')"><div><b>'+m.name+'</b><small>'+m.cal+' kcal · '+m.p+'g protein</small></div></label>').join("")+'</div>';
}
function toggleMeal(i){S.done[S.day+"-"+i]=!S.done[S.day+"-"+i];save();today()}
function resetDay(){S.meals.forEach((_,i)=>delete S.done[S.day+"-"+i]);save();today()}
function week(){document.getElementById("week").innerHTML='<div class="hero"><div class="eyebrow">Weekly plan</div><h2>Build the week before it builds you.</h2><p class="muted">Use hard days for more carbs and normal/easy days for your baseline. Your target is a guide, not a punishment.</p></div><div class="list">'+names.map((n,i)=>'<div class="card row"><div><b>'+n+'</b><div class="muted">'+(i===5||i===0||i===2?"Fitstop / training":"Normal / recovery")+'</div></div><span class="pill">'+(i===5?"Hard":(i===6?"Easy":"Normal"))+'</span></div>').join("")+'</div>'}
function mealLibrary(){document.getElementById("meals").innerHTML='<div class="hero"><div class="eyebrow">Meal library</div><h2>Meals that actually fit your life.</h2><p class="muted">High-protein, practical, heat-and-eat friendly. Add your favourites here as we build VERA out.</p></div><div class="list">'+S.meals.map(m=>'<div class="card recipe"><div class="row"><b>'+m.name+'</b><span class="pill">'+m.type+'</span></div><div class="muted">'+m.cal+' kcal · '+m.p+'P · '+m.c+'C · '+m.f+'F</div></div>').join("")+'</div><button class="full" onclick="alert(\'Recipe editor is next — we will add your full meal library here.\')">＋ Add recipe</button>'}
function shop(){document.getElementById("shop").innerHTML='<div class="hero"><div class="eyebrow">Shopping</div><h2>One list. Less chaos.</h2><p class="muted">This starter list will become automatically generated from your selected weekly meals.</p></div><div class="card"><h3>Protein</h3><p>Chicken breast · lean beef mince · Greek yoghurt · eggs · protein powder</p><h3>Carbs</h3><p>Rice · oats · wraps · potatoes · fruit</p><h3>Extras</h3><p>Salad veg · carrots · tzatziki · sauces · electrolytes</p></div>'}
function connect(){document.getElementById("connect").innerHTML='<div class="hero"><div class="eyebrow">VERA Connect</div><h2>Ready for the real data.</h2><div class="notice"><b>Current:</b> local iPhone app. Your plan and settings stay in this browser.</div></div><div class="list"><div class="card"><h3>🍎 Apple Health</h3><p class="muted">Next layer: native HealthKit companion or your existing Shortcut bridge.</p></div><div class="card"><h3>⌚ Garmin</h3><p class="muted">Next layer: authorised Garmin data sync.</p></div><div class="card"><h3>🥗 MacroFactor</h3><p class="muted">Next layer: import/API pathway where supported.</p></div><div class="card"><h3>📅 Calendar</h3><p class="muted">Next layer: calendar connection to automatically classify hard/normal/easy days.</p></div></div>'}
function settings(){S.theme=S.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=S.theme;document.querySelector('meta[name="theme-color"]').setAttribute("content",S.theme==="dark"?"#111216":"#f5f5f7");save()}
function render(){document.documentElement.dataset.theme=S.theme;days();nav();today();week();mealLibrary();shop();connect();show("today")}
render(); if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
