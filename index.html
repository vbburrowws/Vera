<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#17181c;--muted:#747780;--line:#e5e5e9;--accent:#7c5cff;--nav:#fff;--good:#278a62}
[data-theme=dark]{--bg:#111216;--card:#1b1c21;--text:#f4f4f5;--muted:#9b9da7;--line:#2b2d34;--nav:#18191e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;padding-bottom:92px;min-width:320px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.themeBtn{width:42px;height:42px;padding:0;border-radius:14px;background:var(--card);color:var(--text);border:1px solid var(--line);font-size:20px}
header{padding:18px 16px 8px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);z-index:5}
.brand{font-weight:800;font-size:24px}.sub{color:var(--muted);font-size:12px;margin-top:3px}
.days{display:grid;grid-template-columns:repeat(14,minmax(58px,1fr));gap:5px;padding:12px 0 5px;overflow-x:auto;scrollbar-width:none}.days::-webkit-scrollbar{display:none}.day{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 2px;min-width:0;text-align:center;font-weight:700;font-size:12px}.day small{display:block;font-size:8px;opacity:.7;margin-top:2px}.day.active{background:var(--accent);color:white;border-color:var(--accent)}
main{padding:8px 12px;max-width:720px;margin:auto}.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:8px 0 12px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.hero h2{margin:5px 0 14px;font-size:27px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--bg);border-radius:15px;padding:11px 8px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.card h3{margin:0 0 10px;font-size:16px}.meal{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}.meal input{width:20px;height:20px;accent-color:var(--accent)}.meal small{display:block;color:var(--muted);margin-top:2px}
button{font:inherit;border:0;border-radius:12px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:700}.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}.full{width:100%;margin-top:10px}
.progress{height:9px;background:var(--bg);border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:9px}
.section{display:none}.section.active{display:block}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(72px + env(safe-area-inset-bottom));padding:5px 5px calc(5px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--nav) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;z-index:10}nav button{flex:1;background:transparent;color:var(--muted);padding:6px 2px;font-size:10px}nav button.active{color:var(--accent)}nav span{display:block;font-size:21px;margin-bottom:2px}
.recipe{padding:12px 0;border-top:1px solid var(--line)}.routineRow{align-items:flex-start}.routineRow button{padding:7px 9px;font-size:11px}input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700}.field input,.field select,.field textarea{margin-top:5px}.pill{display:inline-block;background:var(--bg);padding:5px 8px;border-radius:9px;font-size:11px;margin-right:4px}.notice{padding:12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--card));font-size:13px;line-height:1.45}.greeting{font-size:14px;color:var(--muted);font-weight:600}.heroTitle{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.heroTitle h2{flex:1}.status{font-size:10px;padding:6px 8px;border-radius:999px;background:var(--bg);font-weight:800;white-space:nowrap}.nextMeal{display:flex;gap:12px;align-items:center}.mealIcon{width:46px;height:46px;border-radius:15px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}.nextMeal b{font-size:16px}.nextMeal small{display:block;color:var(--muted);margin-top:3px}.timeline{display:grid;gap:0}.timeRow{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.timeRow:first-child{border-top:0}.activity{display:flex;justify-content:space-between;gap:10px}.metric{background:var(--bg);border-radius:14px;padding:11px;flex:1}.metric b{display:block;font-size:17px}.metric span{font-size:10px;color:var(--muted)}
@media(min-width:700px){nav{position:fixed;top:0;bottom:0;right:auto;width:180px;height:100vh;flex-direction:column;padding:30px 12px}nav button{text-align:left;font-size:13px;padding:13px}nav span{display:inline;margin-right:8px}body{padding-left:180px;padding-bottom:0}header{position:relative}.days{max-width:720px;margin:auto}}
</style>

<body>
<header><div class="topbar"><div><div class="brand">VERA</div><div class="sub">V's Everyday Routine Assistant</div></div><button class="themeBtn" onclick="settings()" aria-label="Toggle dark mode">◐</button></div><div class="days" id="days"></div></header>
<main>

<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;padding:20px;overflow:auto"><div style="max-width:620px;margin:40px auto;background:var(--card);color:var(--text);border-radius:22px;padding:18px"><div class="row"><h3 id="modalTitle" style="margin:0"></h3><button class="ghost" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const KEY="vera_iphone_v2";
const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const defaultMeals=[
{id:"breakfast",cat:"Breakfast",emoji:"🍞",name:"English muffin breakfast sandwich",kcal:378,p:28,c:31,f:16,ingredients:[["Woolies","English muffins",5],["Woolies","Eggs",10],["Woolies","Lean ham",250]]},
{id:"bigmac",cat:"Lunch",emoji:"🍔",name:"Big Mac beef bowl",kcal:510,p:42,c:50,f:15,ingredients:[["Woolies","Extra-lean beef mince",900],["Woolies","Lettuce",2],["Woolies","Cucumber",2],["Woolies","Pickles",1],["Woolies","Light mayo",1]]},
{id:"greek",cat:"Lunch",emoji:"🇬🇷",name:"Greek chicken bowl",kcal:450,p:47,c:40,f:11,ingredients:[["Woolies","Shredded chicken breast",750],["Woolies","Lettuce",2],["Woolies","Cucumber",2],["Woolies","Tomatoes",6],["Woolies","Tzatziki",1]]},
{id:"kfc",cat:"Lunch",emoji:"🥗",name:"KFC-style crunch bowl",kcal:367,p:16,c:33,f:19,ingredients:[["Woolies","Chicken breast",500],["Woolies","Lettuce",2],["Woolies","Corn",1],["Woolies","Light dressing",1]]},
{id:"beefroll",cat:"Lunch",emoji:"🌯",name:"Big Mac beef rice-paper rolls",kcal:520,p:40,c:50,f:14,ingredients:[["Woolies","Extra-lean beef mince",900],["Woolies","Rice paper",15],["Woolies","Lettuce",2],["Woolies","Cucumber",2],["Woolies","Pickles",1]]},
{id:"carrots",cat:"Snacks",emoji:"🥕",name:"Carrots + tzatziki",kcal:76,p:3,c:5,f:3,ingredients:[["Woolies","Carrots",1],["Woolies","Tzatziki",1]]},
{id:"yopro",cat:"Snacks",emoji:"🥛",name:"YoPRO strawberry",kcal:119,p:20,c:7,f:1,ingredients:[["Woolies","YoPRO yoghurt",5]]},
{id:"banana",cat:"Snacks",emoji:"🍌",name:"Banana",kcal:100,p:1,c:23,f:0,ingredients:[["Woolies","Bananas",10]]},
{id:"lasagne",cat:"Dinner",emoji:"🍝",name:"High-protein beef lasagne",kcal:627,p:51,c:50,f:24,ingredients:[["Woolies","Extra-lean beef mince",1000],["Woolies","Lasagne sheets",1],["Woolies","Passata",2],["Woolies","Light cheese",1]]},
{id:"stirfry",cat:"Dinner",emoji:"🍜",name:"Beef stir-fry noodles",kcal:485,p:55,c:33,f:15,ingredients:[["Woolies","Lean beef",750],["Woolies","Noodles",5],["Woolies","Stir-fry vegetables",3],["Woolies","Stir-fry sauce",1]]},
{id:"friedrice",cat:"Dinner",emoji:"🍚",name:"Chicken fried rice",kcal:520,p:45,c:58,f:12,ingredients:[["Woolies","Shredded chicken breast",750],["Woolies","Microwave rice",5],["Woolies","Frozen vegetables",2],["Woolies","Eggs",5]]},
{id:"berry",cat:"Dessert",emoji:"🍓",name:"Berry yoghurt bowl",kcal:251,p:31,c:24,f:3,ingredients:[["Woolies","Greek yoghurt",1],["Woolies","Frozen berries",1]]},
{id:"creami",cat:"Dessert",emoji:"🍦",name:"Strawberry cheesecake CREAMi",kcal:235,p:22,c:25,f:3,ingredients:[["Woolies","High-protein yoghurt",5],["Woolies","Skim milk",1],["Woolies","Frozen strawberries",1]]}];
const old=JSON.parse(localStorage.getItem("vera_iphone_v1")||"null");
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{day:old?.day||(new Date().getDay()+1),theme:old?.theme||"light",customMeals:[],planned:{},eaten:{},events:[]};
S.customMeals=S.customMeals||[];S.planned=S.planned||{};S.eaten=S.eaten||{};S.events=S.events||[];S.weekPlan=S.weekPlan||{};S.routine=S.routine||[];S.routineDone=S.routineDone||{};S.reminderEnabled=!!S.reminderEnabled;S.routineBootstrapped=!!S.routineBootstrapped;
if(!S.routineBootstrapped){S.routine=[{id:"wake",time:"06:00",title:"Wake up",note:"Start the day"},{id:"breakfast",time:"07:00",title:"Breakfast",note:"First meal"},{id:"work",time:"09:00",title:"Work / main block",note:"Focus time"},{id:"lunch",time:"12:30",title:"Lunch",note:"Midday meal"},{id:"reset",time:"18:30",title:"Evening reset",note:"Home + reset"},{id:"winddown",time:"21:30",title:"Wind down",note:"Prep tomorrow"}];S.routineBootstrapped=true;save();}
const meals=()=>[...defaultMeals,...S.customMeals];
const fallback=i=>new Date(dayDate(i)+"T12:00").getDay()===6?["banana","breakfast","greek","carrots","stirfry","berry"]:["banana","breakfast","bigmac","carrots","lasagne","berry"];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function get(id){return meals().find(m=>m.id===id)}
function dayDate(i){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(i-1));return d.toISOString().slice(0,10)}
function type(i){const date=dayDate(i);const es=S.events.filter(e=>e.date===date);const t=es.map(e=>e.title).join(" ").toLowerCase();if(/leave|holiday|rest|recovery/.test(t)&&!/fitstop|hyrox|turf|training|gym|coaching|perform|build|peak|sweat|competition|comp/.test(t))return"EASY";if(/fitstop|hyrox|turf|training|gym|coaching|perform|build|peak|sweat|competition|comp/.test(t))return"HARD";const dow=new Date(date+"T12:00").getDay();return dow===0?"EASY":dow===6?"HARD":"NORMAL"}
function target(i){return type(i)==="HARD"?{k:1950,p:160,c:200,f:55}:type(i)==="EASY"?{k:1800,p:160,c:160,f:55}:{k:1850,p:160,c:175,f:55}}
function nav(){document.getElementById("nav").innerHTML=[["today","⌂","Today"],["week","▦","Plan"],["meals","◉","Meals"],["shop","🛒","Shop"],["more","☰","More"]].map(x=>'<button onclick="'+(x[0]==="more"?"openMore()":"show(\\'"+x[0]+"\\')")+'" id="n-'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join("")}
function openMore(){openModal("More",'<div class="card"><button class="full" onclick="closeModal();show(\'calendar\')">📅 Calendar</button><button class="full" onclick="closeModal();show(\'routine\')">⏰ Routine</button><button class="full" onclick="closeModal();show(\'connect\')">⚙ Connect</button></div>')}
function days(){document.getElementById("days").innerHTML=Array.from({length:14},(_,j)=>{const i=j+1,d=new Date(dayDate(i)+"T12:00"),n=names[d.getDay()];return '<button class="day '+(S.day===i?"active":"")+'" onclick="S.day='+i+';save();render()"><b>'+n+'</b><small>'+d.getDate()+' '+d.toLocaleDateString(undefined,{month:"short"})+'</small><small>'+type(i)+'</small></button>'}).join("")}
function show(id){document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.getElementById("n-"+id).classList.add("active");if(id==="today")today();if(id==="week")week();if(id==="meals")library();if(id==="shop")shop();if(id==="calendar")calendar();if(id==="routine")routine();if(id==="connect")connect()}
function sums(ids){return ids.map(get).filter(Boolean).reduce((a,m)=>({k:a.k+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{k:0,p:0,c:0,f:0})}
function todayTimeline(){const i=S.day,date=dayDate(i),events=S.events.filter(e=>e.date===date),routine=S.routine||[],ids=S.planned[i]||fallback(i),items=[];const mins=v=>{const m=String(v||"").match(/(?:at\\s*)?(\\d{1,2}):(\\d{2})\\s*(am|pm)?/i);if(!m)return null;let h=+m[1],n=+m[2];if((m[3]||"").toLowerCase()==="pm"&&h<12)h+=12;if((m[3]||"").toLowerCase()==="am"&&h===12)h=0;return h*60+n};const busy=(t)=>events.some(e=>{const a=mins(e.start),b=mins(e.end);return a!=null&&b!=null&&t>=a-15&&t<=b+15});events.forEach(e=>items.push({time:e.start||"",title:e.title||"Calendar event",meta:"Calendar",fixed:true}));routine.forEach(r=>items.push({time:r.time||"",title:r.title||"Routine",meta:"Routine",fixed:false}));const hard=type(i)==="HARD";const hasMorning=events.some(e=>{const a=mins(e.start);return a!=null&&a<600&&/fitstop|training|gym|hyrox|coaching|workout/i.test(e.title||"")});const mealBase=hasMorning?[420,750,1110]:[450,750,1110];const mealNames=["Breakfast","Lunch","Dinner"];mealBase.forEach((base,n)=>{let t=base;while(busy(t)&&t<base+120)t+=30;const m=get(ids[n]);items.push({time:String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"),title:m?m.emoji+" "+m.name:mealNames[n],meta:"VERA · "+(hard&&n===0?"post-training meal":mealNames[n]),fixed:false})});const eveningBusy=events.some(e=>{const a=mins(e.start),b=mins(e.end);return a!=null&&b!=null&&b>=1020&&a<=1200});if(!eveningBusy)items.push({time:"18:00",title:"10-min home reset",meta:"VERA · household",fixed:false});items.push({time:"21:30",title:"Wind down",meta:"VERA · routine",fixed:false});items.sort((a,b)=>(mins(a.time)||9999)-(mins(b.time)||9999));return '<div class="card timelineCard"><div class="row"><h3>Your day</h3><span class="muted">'+type(i)+'</span></div><div class="timeline">'+items.map(x=>'<div class="timelineItem"><div class="timelineTime">'+x.time+'</div><div class="timelineDot"></div><div class="timelineContent"><b>'+x.title+'</b><small>'+x.meta+(x.fixed?' · calendar':'')+'</small></div></div>').join("")+'</div></div>'}
function today(){const i=S.day,ids=S.planned[i]||fallback(i),e=S.eaten[i]||[],t=target(i),a=sums(e),left=t.k-a.k;document.getElementById("today").innerHTML='<div class="hero"><div class="greeting">'+(new Date().getHours()<12?"Good morning":new Date().getHours()<17?"Good afternoon":"Good evening")+', V 👋</div><div class="heroTitle"><h2>'+names[i-1]+'. Let’s make today easy.</h2><span class="status">'+type(i)+'</span></div><p class="muted">'+(S.events.length?"Calendar-aware plan · events imported":"Import your calendar in Connect and VERA will classify the day automatically")+'</p><div class="stats"><div class="stat"><b>'+a.k+'</b><span>of '+t.k+' kcal</span></div><div class="stat"><b>'+a.p+'g</b><span>protein</span></div><div class="stat"><b>'+a.c+'g</b><span>carbs</span></div><div class="stat"><b>'+Math.max(0,left)+'</b><span>kcal left</span></div></div><div class="progress"><div class="bar" style="width:'+Math.min(100,a.k/t.k*100)+'%"></div></div></div>'+todayTimeline()+'<div class="card"><h3>VERA’s nudge</h3><div class="notice">'+(type(i)==="HARD"?"Hard day: keep the carbs in. Performance gets priority.":left>700?"You have <b>"+left+" kcal</b> left. Start with protein, then place carbs around training.":left>0?"You’re on track. Build the next meal around protein and produce.":"You’re around your planned intake. Focus on recovery and hunger — not chasing Garmin burn.")+'</div></div><div class="card"><div class="row"><h3>Today’s meals</h3><button class="ghost" onclick="weeklyReset()">Plan Week</button></div>'+ids.map(id=>{const m=get(id),done=e.includes(id);return m?'<label class="meal"><input type="checkbox" '+(done?"checked":"")+' onchange="eat(\''+id+'\')"><div><b>'+m.emoji+' '+m.name+'</b><small>'+m.kcal+' kcal · '+m.p+'P · '+m.c+'C · '+m.f+'F</small></div></label>':""}).join("")+'</div><div class="card"><h3>Remaining macros</h3><div class="stats"><div class="stat"><b>'+Math.max(0,left)+'</b><span>kcal</span></div><div class="stat"><b>'+Math.max(0,t.p-a.p)+'g</b><span>protein</span></div><div class="stat"><b>'+Math.max(0,t.c-a.c)+'g</b><span>carbs</span></div><div class="stat"><b>'+Math.max(0,t.f-a.f)+'g</b><span>fat</span></div></div></div>'}
function eat(id){let a=S.eaten[S.day]||[];S.eaten[S.day]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();today()}
function weeklyReset(){openModal("Friday Weekly Reset",'<div class="notice"><b>Plan next week, Sunday → Saturday.</b><br>Before building your plan, make sure your Apple Calendar includes work, Fitstop training, Fitstop coaching, other training, social plans, rest and leave.</div><div class="card"><h3>Calendar checklist</h3><div class="meal">☐ Normal work</div><div class="meal">☐ Fitstop training</div><div class="meal">☐ Fitstop coaching</div><div class="meal">☐ Other training / Hyrox</div><div class="meal">☐ Social plans</div><div class="meal">☐ Rest / recovery</div><div class="meal">☐ Leave / travel</div></div><button class="full" onclick="closeModal();show(\'calendar\')">Review calendar</button><button class="full" onclick="closeModal();buildNextWeek()">Build my week</button>')}
function nextWeekDate(offset){const d=new Date();d.setHours(12,0,0,0);const dow=d.getDay();d.setDate(d.getDate()+(7-dow)+offset);return d.toISOString().slice(0,10)}
function nextWeekLabel(offset){const d=new Date(nextWeekDate(offset)+"T12:00");return d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"})}
function nextWeekEvents(date){return S.events.filter(e=>e.date===date)}
function nextWeekType(offset){const date=nextWeekDate(offset);const t=nextWeekEvents(date).map(e=>e.title).join(" ").toLowerCase();if(/leave|holiday|rest|recovery/.test(t)&&!/fitstop|hyrox|turf|training|gym|coaching|perform|build|peak|sweat|competition|comp/.test(t))return"EASY";if(/fitstop|hyrox|turf|training|gym|coaching|perform|build|peak|sweat|competition|comp/.test(t))return"HARD";return offset===0?"EASY":"NORMAL"}
function nextWeekTarget(offset){const x=nextWeekType(offset);return x==="HARD"?{k:1950,p:160,c:200,f:55}:x==="EASY"?{k:1800,p:160,c:160,f:55}:{k:1850,p:160,c:175,f:55}}
function macroFactorMeal(id){return String(id||"").startsWith("mf_")}function preferMacroFactor(ids,offset){return ids.map((id,j)=>{const base=get(id);if(!base)return id;const pool=meals().filter(m=>macroFactorMeal(m.id)&&m.cat===base.cat);return pool.length?pool[(offset+j)%pool.length].id:id})}function mealSetFor(type,offset){const sets={EASY:[["breakfast","greek","yopro","carrots","stirfry","berry","banana"],["breakfast","bigmac","yopro","carrots","lasagne","creami","banana"],["breakfast","greek","yopro","carrots","friedrice","berry","banana"]],NORMAL:[["breakfast","bigmac","yopro","carrots","friedrice","berry"],["breakfast","greek","yopro","carrots","stirfry","creami"],["breakfast","beefroll","yopro","carrots","friedrice","berry"]],HARD:[["breakfast","beefroll","yopro","carrots","friedrice","creami","banana"],["breakfast","bigmac","yopro","carrots","stirfry","berry","banana"],["breakfast","greek","yopro","carrots","lasagne","creami","banana"]]};return preferMacroFactor(sets[type][offset%sets[type].length],offset)}
function comboTotals(ids){return sums(ids)}

function pickRecipeImagesStage1(){const input=document.createElement("input");input.type="file";input.accept="image/*";input.multiple=true;input.onchange=()=>{const files=Array.from(input.files||[]);if(!files.length)return;const thumbs=files.map((file,i)=>"<div class='recipe'><div class='row'><b>Screenshot "+(i+1)+"</b><span class='pill'>"+esc(file.name)+"</span></div><img src='"+URL.createObjectURL(file)+"' style='width:100%;max-height:240px;object-fit:contain;border-radius:14px;margin-top:8px'></div>").join("");openModal("Screenshot preview","<div class='notice'><b>"+files.length+" image"+(files.length===1?"":"s")+" selected.</b><br>VERA will read them one at a time and then let you review the combined result before saving.</div>"+thumbs+"<button class='full' onclick='runMultiRecipeOCR(window._veraRecipeFiles||[])'>Read selected images</button><button class='full ghost' onclick='closeModal()'>Cancel</button>");window._veraRecipeFiles=files};input.click()}
async function runMultiRecipeOCR(files){files=Array.from(files||[]);if(!files.length)return;openModal("Reading screenshots","<div class='notice'><b>Step 1 of "+files.length+"</b><br>VERA is reading each screenshot separately. Nothing is saved automatically.</div><p id='ocrMultiStatus' class='muted'>Starting OCR…</p>");let texts=[];try{if(!window.Tesseract)throw new Error("OCR library did not load");for(let i=0;i<files.length;i++){const el=document.getElementById("ocrMultiStatus");if(el)el.textContent="Reading screenshot "+(i+1)+" of "+files.length+"…";const result=await Tesseract.recognize(files[i],"eng",{logger:m=>{const el=document.getElementById("ocrMultiStatus");if(el&&m.status)el.textContent="Screenshot "+(i+1)+" of "+files.length+" — "+m.status+(m.progress?" "+Math.round(m.progress*100)+"%":"")}});texts.push(result.data.text||"")}showOCRReview(texts.join("\n\n"),files.map(f=>f.name).join(" + "));window._veraRecipeFiles=[]}catch(e){console.error(e);openModal("OCR could not finish","<div class='notice'>VERA couldn't read all of the selected screenshots. Your images were not saved. Please try 1–2 screenshots at a time, or use Paste recipe details instead.</div><button class='full ghost' onclick='closeModal()'>Close</button>")}}
async function pickRecipeImage(){const input=document.createElement("input");input.type="file";input.accept="image/*";input.onchange=async()=>{const file=input.files[0];if(!file)return;openModal("Scanning image","<div class='notice'>VERA is reading the image.</div><p id='ocrStatus' class='muted'>Starting OCR…</p><img id='ocrPreview' style='width:100%;max-height:280px;object-fit:contain;border-radius:14px;margin-top:10px'>");const img=document.getElementById("ocrPreview");img.src=URL.createObjectURL(file);try{if(!window.Tesseract)throw new Error("OCR library did not load");const result=await Tesseract.recognize(file,"eng",{logger:m=>{const el=document.getElementById("ocrStatus");if(el)el.textContent=(m.status||"Reading")+" "+(m.progress?Math.round(m.progress*100)+"%":"")}});showOCRReview(result.data.text||"",file.name)}catch(e){console.error(e);toast("Could not read image automatically")}};input.click()}
function showOCRReview(raw,fileName){
const text=String(raw||"").replace(/\r/g,"\n");
const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
const joined=lines.join(" ").replace(/\s+/g," ");
function first(re){const m=joined.match(re);return m&&m[1]?m[1]:""}
function macroValue(label){
  let v=first(new RegExp(label+"[^0-9]{0,35}(\\d+(?:[.,]\\d+)?)\\s*g\\s*(?:/|per)?\\s*serv","i"));
  if(v)return v.replace(",",".");
  v=first(new RegExp(label+"[^0-9]{0,35}(\\d+(?:[.,]\\d+)?)\\s*g","i"));
  if(v)return v.replace(",",".");
  return "";
}
let kcal=first(/(?:calories|energy)[^0-9]{0,25}(\d{2,4})\s*k?cal/i);
if(!kcal)kcal=first(/(\d{2,4})\s*kcal\s*\/?\s*serv/i);
let p=macroValue("protein"), c=macroValue("carb(?:ohydrate)?s?"), f=macroValue("fat");
const carbPair=joined.match(/carb(?:ohydrate)?s?[^0-9]{0,20}(\d{2,4})\s*\/\s*(\d{2,4})\s*g[^0-9]{0,10}(\d{1,3})%/i);
if(carbPair&&(!c||!/[\.,]/.test(c))){const rawC=carbPair[1],targetC=+carbPair[2],pct=+carbPair[3],n=+rawC;if(targetC&&pct&&n>targetC&&Math.abs((n/targetC*100)-pct)<3)c=(n/10).toFixed(1);}
const cleanLines=lines.filter(x=>!(/^\d{1,2}:\d{2}(?:\s*[|\\].*)?$/.test(x))&&!/^(?:wifi|lte|5g|ft)\b/i.test(x)&&!/^\d+[\s|\\-]*$/.test(x));
let name=cleanLines.find(x=>!/(calories|energy|protein|fat|carb|fiber|net|starch|nutrition|serving|target|%)/i.test(x)&&x.length>1)||fileName.replace(/\.[^.]+$/,"");
const cat=/drink|bar|snack|yoghurt|yogurt|chips|cracker|powerade|gatorade|protein/i.test(joined)?"Snacks":"Dinner";
const ingredientLines=lines.filter(x=>/(?:by |\b(?:g|kg|ml|l)\b|\d+\s*(?:slice|serving|piece|egg|tbsp|tsp))/i.test(x)&&!/(calories|protein|fat|carb|fiber|net|starch|target)/i.test(x));

openModal("Review scanned item","<div class='notice'><b>OCR result — check it before saving.</b><br>VERA now prioritises the <b>per-serving</b> MacroFactor values and ignores the iPhone status bar. Check the values before saving.</div><div class='field'><label>Name<input id='ocrName' value='"+esc(name)+"'></label></div><div class='field'><label>Category<select id='ocrCat'>"+["Breakfast","Lunch","Snacks","Dinner","Dessert"].map(x=>"<option "+(x===cat?"selected":"")+">"+x+"</option>").join("")+"</select></label></div><div class='stats'><div class='field'><label>Calories<input id='ocrK' type='number' value='"+kcal+"'></label></div><div class='field'><label>Protein (g)<input id='ocrP' type='number' value='"+p+"'></label></div><div class='field'><label>Carbs (g)<input id='ocrC' type='number' value='"+c+"'></label></div><div class='field'><label>Fat (g)<input id='ocrF' type='number' value='"+f+"'></label></div></div><div class='field'><label>Shopping item / ingredients<textarea id='ocrI' rows='5'>"+esc(ingredientGuess||name)+"</textarea></label></div><button class='full' onclick='saveOCRRecipe()'>Save to VERA</button>")}
function saveOCRRecipe(){const x={name:ocrName.value,category:ocrCat.value,calories:ocrK.value,protein:ocrP.value,carbs:ocrC.value,fat:ocrF.value,ingredients:[ocrI.value]};if(saveImportedRecipe(x)){save();closeModal();library();toast("Item saved ✓")}}function pickRecipeFile(){const input=document.createElement("input");input.type="file";input.accept=".json,.csv,.txt,.tsv,text/csv,application/json,text/plain";input.onchange=async()=>{const file=input.files[0];if(!file)return;const text=await file.text();let added=0;try{if(file.name.toLowerCase().endsWith(".json")){const data=JSON.parse(text);const arr=Array.isArray(data)?data:(data.recipes||data.data||[]);arr.forEach(x=>{if(saveImportedRecipe(x))added++})}else{const lines=text.replace(/\r/g,"").split("\n").filter(Boolean);if(lines.length>1){const head=parseCSVLine(lines[0]).map(x=>x.trim().toLowerCase());lines.slice(1).forEach(line=>{const vals=parseCSVLine(line),x={};head.forEach((h,i)=>x[h]=vals[i]||"");if(saveImportedRecipe(x))added++})}}}catch(e){console.error(e)}save();closeModal();library();toast(added+" recipes imported ✓")};input.click()}
function parseCSVLine(line){const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==="\""&&line[i+1]==="\""){cur+="\"";i++;continue}if(ch==="\""){q=!q;continue}if((ch===","||ch==="\\t")&&!q){out.push(cur);cur="";continue}cur+=ch}out.push(cur);return out}

function saveImportedRecipe(x){const name=x.name||x.title||x.recipe||x["recipe name"]||x["food name"];if(!name)return false;const catRaw=String(x.category||x.cat||x.type||"Dinner").toLowerCase();const cat=/snack/.test(catRaw)?"Snacks":/breakfast/.test(catRaw)?"Breakfast":/lunch/.test(catRaw)?"Lunch":/dessert|sweet/.test(catRaw)?"Dessert":"Dinner";let ing=x.ingredients||x.ingredient||x.items||"";let ingredients=[];if(Array.isArray(ing))ingredients=ing.map(a=>Array.isArray(a)?a:["Woolies",String(a),1]);else ingredients=String(ing).split(/\n|;|\|/).map(s=>s.trim()).filter(Boolean).map(s=>["Woolies",s,1]);const m={id:"mf_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),cat,emoji:cat==="Snacks"?"🍿":cat==="Breakfast"?"🥣":cat==="Lunch"?"🥗":cat==="Dessert"?"🍓":"🍽️",name:String(name),kcal:normNum(x.kcal||x.calories||x["calories per serving"]),p:normNum(x.p||x.protein||x["protein (g)"]),c:normNum(x.c||x.carbs||x.carbohydrates||x["carbs (g)"]),f:normNum(x.f||x.fat||x["fat (g)"]),ingredients};S.customMeals.push(m);return true}

function saveRoutineItem(id){const x={id:id||"r_"+Date.now(),time:rt.value||"08:00",title:rtitle.value||"Routine item",note:rnote.value||""};const i=S.routine.findIndex(r=>r.id===x.id);if(i>=0)S.routine[i]=x;else S.routine.push(x);save();closeModal();routine();toast("Routine updated ✓")}
function deleteRoutineItem(id){S.routine=S.routine.filter(x=>x.id!==id);save();closeModal();routine();toast("Routine item removed")}
function checkRoutineReminders(){if(!S.reminderEnabled||!("Notification"in window)||Notification.permission!=="granted")return;const now=new Date(),hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),d=routineDateKey();S._reminded=S._reminded||{};S._reminded[d]=S._reminded[d]||[];S.routine.filter(x=>x.time===hm&&!S._reminded[d].includes(x.id)).forEach(x=>{new Notification("VERA reminder",{body:x.title+(x.note?" — "+x.note:"")});S._reminded[d].push(x.id);save()})}function connect(){document.getElementById("connect").innerHTML='<div class="hero"><div class="eyebrow">VERA Connect</div><h2>Give VERA the context.</h2><div class="notice"><b>Important:</b> a ChatGPT calendar connection does not automatically feed this public GitHub Pages app. VERA needs an API/backend or an import bridge. We are building the bridge first.</div></div><div class="card"><h3>📅 Calendar</h3><p class="muted">Import an .ics file now. VERA will use event names to classify Easy / Normal / Hard days.</p><button class="full" onclick="importICS()">Import calendar (.ics)</button><p class="muted">'+(S.events.length?S.events.length+" events imported.":"No events imported yet.")+'</p></div><div class="card"><h3>⌚ Garmin</h3><p class="muted">Next: authorised Garmin sync for steps, workouts and recovery context. Your existing Garmin → Apple Health bridge remains useful.</p></div><div class="card"><h3>🥗 MacroFactor recipes</h3><p class="muted">Import your recipes into VERA so their calories, macros and ingredients become available to the planner and shopping list.</p><button class="full" onclick="show(&quot;meals&quot;)">Open recipe library</button></div><div class="card"><h3>🍎 Apple Health</h3><p class="muted">Direct HealthKit access requires a native iPhone companion. For this web app, your existing Shortcut bridge is the practical route.</p></div>'}
function importCalendarText(raw){const text=String(raw||"").replace(/\\+/g," ").trim();const lines=text.split(/\n|\r/).map(x=>x.trim()).filter(Boolean);const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};S.events=lines.map(line=>{const p=line.split("|").map(x=>x.trim());const start=p[1]||"";let date="";let m=start.match(/(\d{4})[-\/]([0-9]{1,2})[-\/]([0-9]{1,2})/);if(m)date=m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");else{m=start.match(/([0-9]{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})/);if(m&&months[m[2].slice(0,3).toLowerCase()])date=m[3]+"-"+String(months[m[2].slice(0,3).toLowerCase()]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0")}return{date,title:p[0]||"Calendar event",start,end:p[2]||""}}).filter(x=>x.date);save();render()}
function importICS(){const input=document.createElement("input");input.type="file";input.accept=".ics,text/calendar";input.onchange=async()=>{const txt=await input.files[0].text();S.events=txt.replace(/\r/g,"").split("BEGIN:VEVENT").slice(1).map(b=>{const get=k=>{const l=b.split("\n").find(x=>x.startsWith(k));return l?l.substring(l.indexOf(":")+1):""};const raw=get("DTSTART");return{date:raw.slice(0,8).replace(/(\d{4})(\d{2})(\d{2})/,"$1-$2-$3"),title:get("SUMMARY")||"Calendar event"}}).filter(x=>x.date);save();render();show("connect");toast(S.events.length+" events imported ✓")};input.click()}
function settings(){toggleTheme()}function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=S.theme;save()}
function openModal(t,b){const modal=document.getElementById("modal");if(!modal)return;document.getElementById("modalTitle").textContent=t;document.getElementById("modalBody").innerHTML=b;document.getElementById("modal").style.display="block"}function closeModal(){const modal=document.getElementById("modal");if(modal)modal.style.display="none"}function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}function toast(x){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style="position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:12px;z-index:30";document.body.appendChild(t)}t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",1600)}
function render(){document.documentElement.dataset.theme=S.theme;days();nav();today();week();library();shop();routine();connect();show("today")}
(function(){const q=new URLSearchParams(location.search).get("calendar");if(q){try{importCalendarText(q);history.replaceState({},document.title,location.pathname)}catch(e){console.error(e)}}})();
render();setInterval(checkRoutineReminders,15000);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
